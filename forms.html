<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08090b" />
  <meta name="description" content="Submit applications, suggestions and appeals to Venture Roleplay." />
  <link rel="canonical" href="https://scapecodes.github.io/VentureRP/forms.html" /><meta property="og:title" content="Venture Roleplay Suggestions" /><meta property="og:description" content="Browse ideas from the Venture community and help shape what comes next." /><meta property="og:image" content="https://scapecodes.github.io/VentureRP/images/venture-community.jpg" /><meta name="twitter:card" content="summary_large_image" /><link rel="manifest" href="site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>Forms — Venture Roleplay</title>
  <link rel="icon" href="logo.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-portal-page="forms">
  <div class="site-shell">
    <header class="navbar navbar--scrolled"><a class="skip-link" href="#content">Skip to content</a><div class="nav-inner">
      <a class="brand" href="index.html"><img src="logo.png" alt="" /><span><b>VENTURE</b><small>ROLEPLAY</small></span></a>
      <nav class="nav-links" aria-label="Main navigation"><a href="index.html"><span>01</span>Home</a><a href="join.html"><span>02</span>Join us</a><a href="rules.html"><span>03</span>Rules</a><a class="button button--small nav-discord" href="#login">Login</a></nav>
      <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false"><span class="icon" data-icon="menu"></span></button>
    </div></header>
    <main id="content" class="portal-main portal-main--flush">
      <section class="suggestions-browser section-shell">
        <div class="suggestions-heading"><div><p class="eyebrow"><span></span> Community forum</p><h1>SUGGESTIONS</h1><p>Browse ideas from the Venture community and help shape what comes next.</p></div><button class="button" id="create-suggestion" type="button">Create a suggestion</button></div>
        <div class="suggestions-toolbar"><label class="suggestion-search"><span class="icon" data-icon="search"></span><input id="suggestion-query" type="search" placeholder="Search suggestions…" /></label><label class="suggestion-sort"><span>Sort</span><select id="suggestion-sort"><option value="newest">Newest</option><option value="popular">Popular</option><option value="oldest">Oldest</option></select></label><div id="suggestion-count"></div></div>
        <div class="suggestion-filters" id="suggestion-filters" aria-label="Filter suggestions"><button class="active" data-status="all">All</button><button data-status="received">New</button><button data-status="in review">Under review</button><button data-status="approved">Accepted</button><button data-status="declined">Declined</button></div>
        <div id="suggestions-list" class="suggestions-list" aria-live="polite"></div>
        <div class="suggestion-pagination"><button class="button button--ghost" id="load-more-suggestions" type="button" hidden>Load more</button></div>
      </section>
    </main>
  </div>
  <dialog id="form-dialog" class="portal-dialog"><button class="dialog-close" type="button" aria-label="Close">×</button><div id="form-dialog-body"></div></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="portal-config.js"></script><script src="main.js"></script><script src="portal.js"></script>
</body>
</html>
